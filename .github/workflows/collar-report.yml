name: Collar telemetry report

# Fetches each collar's recent telemetry from Supabase (public key, via a
# scoped read-only function) and publishes a compact JSON summary to the
# dedicated `telemetry` branch (force-pushed, so it can never conflict with
# main or with a previous run). A scheduled job reads that file and emails
# the owner — this workflow only gathers the data.
on:
  schedule:
    - cron: "27 11 */3 * *"   # every ~3 days, 11:27 UTC (best-effort on free tier)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collar-telemetry
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch telemetry and build summary
        env:
          SB_URL: https://pnileizziwrhwefnzicz.supabase.co
          SB_KEY: sb_publishable_cxrTsmvBy7_utuMeosQNfQ_ws_iAk0B
        run: node scripts/collar-report.mjs

      - name: Publish to the telemetry branch
        run: |
          git config user.name "collar-telemetry-bot"
          git config user.email "actions@users.noreply.github.com"
          cp telemetry/collar-report.json "$RUNNER_TEMP/collar-report.json"
          git checkout --orphan telemetry
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/collar-report.json" ./collar-report.json
          git add collar-report.json
          git commit -m "collar telemetry $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin telemetry
