name: Collar telemetry report

# Fetches each collar's recent telemetry from Supabase (public anon key) and
# commits a compact JSON summary to telemetry/collar-report.json. A separate
# scheduled job reads that file and emails the owner — this workflow only
# gathers the data (GitHub's runners can reach Supabase; the owner's other
# automation cannot).
on:
  schedule:
    - cron: "27 11 */3 * *"   # every ~3 days, 11:27 UTC (best-effort on free tier)
  workflow_dispatch:            # allow manual/triggered runs

permissions:
  contents: write

jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch telemetry and build summary
        env:
          SB_URL: https://pnileizziwrhwefnzicz.supabase.co
          SB_KEY: sb_publishable_cxrTsmvBy7_utuMeosQNfQ_ws_iAk0B
        run: |
          node <<'EOF'
          const URL = process.env.SB_URL, KEY = process.env.SB_KEY;
          const COLLARS = {
            "2-cell": "dev:868531060199697",
            "3-cell": "dev:868531063312784",
            "4-cell": "dev:868531063304930",
          };
          const WINDOW_DAYS = 7;
          const CUTOFF_V = 3.3;            // assumed low-battery cutoff for runtime projection
          const MOVE_M = 25;              // metres: a fix farther than this counts as "moved"

          const toRad = d => d * Math.PI / 180;
          function haversine(a, b) {
            const R = 6371000;
            const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
            const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
            return 2 * R * Math.asin(Math.sqrt(s));
          }

          async function fetchRows(dev) {
            const since = new Date(Date.now() - WINDOW_DAYS*864e5).toISOString();
            const q = `${URL}/rest/v1/locations?select=recorded_at,battery,lat,lng`
              + `&device_id=eq.${encodeURIComponent(dev)}`
              + `&recorded_at=gte.${since}&order=recorded_at.asc&limit=5000`;
            const r = await fetch(q, { headers: { apikey: KEY, Authorization: `Bearer ${KEY}` } });
            if (!r.ok) throw new Error(`${dev}: HTTP ${r.status} ${await r.text()}`);
            return r.json();
          }

          function summarize(rows) {
            if (!rows.length) return { fixes: 0 };
            const batt = rows.filter(r => r.battery != null);
            const first = batt[0], last = batt[batt.length - 1];
            let drainPerDay = null, projDays = null;
            if (batt.length >= 2) {
              const days = (new Date(last.recorded_at) - new Date(first.recorded_at)) / 864e5;
              if (days > 0.2) {
                drainPerDay = (first.battery - last.battery) / days;         // +ve = draining
                if (drainPerDay > 0.0005) projDays = (last.battery - CUTOFF_V) / drainPerDay;
              }
            }
            // movement over the window + in the last 24h
            let distM = 0, dist24 = 0;
            const cut24 = Date.now() - 864e5;
            for (let i = 1; i < rows.length; i++) {
              const d = haversine(rows[i-1], rows[i]);
              distM += d;
              if (new Date(rows[i].recorded_at).getTime() >= cut24) dist24 += d;
            }
            const newest = rows[rows.length - 1];
            return {
              fixes: rows.length,
              last_seen: newest.recorded_at,
              last_location: { lat: newest.lat, lng: newest.lng },
              battery_now: last ? last.battery : null,
              battery_window_start: first ? first.battery : null,
              battery_min: batt.length ? Math.min(...batt.map(r => r.battery)) : null,
              battery_max: batt.length ? Math.max(...batt.map(r => r.battery)) : null,
              drain_v_per_day: drainPerDay,
              projected_days_to_cutoff: projDays,
              cutoff_v: CUTOFF_V,
              distance_m_window: Math.round(distM),
              distance_m_24h: Math.round(dist24),
              moving_recently: dist24 > MOVE_M,
            };
          }

          (async () => {
            const out = { generated_at: new Date().toISOString(), window_days: WINDOW_DAYS, collars: {} };
            for (const [label, dev] of Object.entries(COLLARS)) {
              try {
                const rows = await fetchRows(dev);
                out.collars[label] = { device_id: dev, ...summarize(rows) };
              } catch (e) {
                out.collars[label] = { device_id: dev, error: String(e && e.message || e) };
              }
            }
            require("fs").mkdirSync("telemetry", { recursive: true });
            require("fs").writeFileSync("telemetry/collar-report.json", JSON.stringify(out, null, 2) + "\n");
            console.log(JSON.stringify(out, null, 2));
          })();
          EOF

      - name: Commit the summary
        run: |
          git config user.name "collar-telemetry-bot"
          git config user.email "actions@users.noreply.github.com"
          git add telemetry/collar-report.json
          git commit -m "collar telemetry $(date -u +%Y-%m-%dT%H:%M:%SZ)" || { echo "no changes"; exit 0; }
          git push
